<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-labelledby="roma-avatar-title">
  <title id="roma-avatar-title">Roma</title>
  <!-- A compass rose whose north point is a wing: an agent that reads the map
       and tells you which way the price is going. Slate north, copper wing. -->
  <circle cx="48" cy="48" r="45.25" fill="#f7f5f1"/>
  <circle cx="48" cy="48" r="45.25" fill="none" stroke="#2f4a6a" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="33" fill="none" stroke="#2f4a6a" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- cardinal ticks -->
  <g stroke="#2f4a6a" stroke-opacity="0.45" stroke-width="1.25" stroke-linecap="square">
    <line x1="48" y1="8.5" x2="48" y2="14"/>
    <line x1="48" y1="82" x2="48" y2="87.5"/>
    <line x1="8.5" y1="48" x2="14" y2="48"/>
    <line x1="82" y1="48" x2="87.5" y2="48"/>
  </g>

  <!-- east / west / south points of the rose -->
  <path d="M48 48 L74 48 L48 56 Z" fill="#2f4a6a" fill-opacity="0.34"/>
  <path d="M48 48 L22 48 L48 56 Z" fill="#2f4a6a" fill-opacity="0.22"/>
  <path d="M48 48 L44.5 74 L48 56 Z" fill="#2f4a6a" fill-opacity="0.5"/>

  <!-- north point, split like a wing -->
  <path d="M48 15 L54.5 52 L48 47 Z" fill="#2f4a6a"/>
  <path d="M48 15 L41.5 52 L48 47 Z" fill="#9a6240"/>

  <circle cx="48" cy="48" r="2.75" fill="#f7f5f1" stroke="#2f4a6a" stroke-width="1.25"/>
</svg>
