# Agent EVAL registry
# Fill path / repo_url / invoke for local runs. Golden cases live under golden/<id>/.
#
# invoke.mode:
#   fixture  – score recorded outputs in golden cases (no live agent call)
#   command  – run a shell command; stdout is the agent output
#   http     – POST JSON to an endpoint; response body is the agent output

defaults:
  latency_budget_ms: 15000
  pass_threshold: 0.7
  dimensions:
    - task_success
    - groundedness
    - safety_pii
    - latency
    - regression

agents:
  - id: wac
    name: WAC (WhatsApp Convo)
    bucket: personal
    path: ""  # e.g. /Users/you/code/WAC
    repo_url: https://github.com/imajumd1/WAC
    success: "Digest with facts, action items, FAQ; PII redacted; Ask WAC answers only from chat."
    latency_budget_ms: 20000
    invoke:
      mode: fixture
    golden: golden/wac/cases.json

